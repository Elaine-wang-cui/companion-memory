// ---------- 手势：拖动环绕 / 双指缩放 / 点按 ----------
var ptrs={},st=null,moved=false,pd0=0,d0=0;
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);ptrs[e.pointerId]=[e.clientX,e.clientY];idleT=0;var k=Object.keys(ptrs);if(k.length===1){moved=false;st={x:e.clientX,y:e.clientY,th:orb.tth,ph:orb.tph}}if(k.length===2){var a=ptrs[k[0]],b=ptrs[k[1]];pd0=Math.hypot(a[0]-b[0],a[1]-b[1]);d0=orb.td;moved=true}});
cv.addEventListener('pointermove',function(e){if(!ptrs[e.pointerId])return;ptrs[e.pointerId]=[e.clientX,e.clientY];idleT=0;var k=Object.keys(ptrs);
 if(k.length===2){var a=ptrs[k[0]],b=ptrs[k[1]],pdn=Math.hypot(a[0]-b[0],a[1]-b[1]);orb.td=Math.max(140,Math.min(1500,d0*pd0/Math.max(1,pdn)));return}
 if(!st)return;var dx=e.clientX-st.x,dy=e.clientY-st.y;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;if(moved){orb.tth=st.th-dx*.006;orb.tph=Math.max(.15,Math.min(1.45,st.ph-dy*.005))}});
function up(e){var single=Object.keys(ptrs).length===1;delete ptrs[e.pointerId];if(Object.keys(ptrs).length===1){var k=Object.keys(ptrs)[0];st={x:ptrs[k][0],y:ptrs[k][1],th:orb.tth,ph:orb.tph}}
 if(single&&!moved&&DATA)pick(e.clientX,e.clientY);if(!Object.keys(ptrs).length)st=null}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',function(e){delete ptrs[e.pointerId];st=null});
cv.addEventListener('wheel',function(e){e.preventDefault();idleT=0;orb.td=Math.max(140,Math.min(1500,orb.td*Math.exp(e.deltaY*.0012)))},{passive:false});
