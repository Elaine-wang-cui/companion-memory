<title>记忆星图</title>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#sky{position:fixed;inset:0;width:100%;height:100%;touch-action:none;background:radial-gradient(ellipse at 30% 20%,#2a1a4a 0%,#120d2c 45%,#06051a 100%)}
header{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;background:linear-gradient(#07061aee,#07061a00);pointer-events:none}
header>*{pointer-events:auto}
h1{margin:0;font-size:20px;font-weight:600;letter-spacing:2px;color:var(--gold);text-shadow:0 0 12px #f6d38b66}

.stats{display:flex;gap:14px;margin:8px 0;font-size:12px;color:var(--mute);flex-wrap:wrap}
.stats b{display:block;font-size:17px;color:var(--ink);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=search]{flex:1;min-width:150px;max-width:340px;background:#ffffff14;border:1px solid #ffffff26;border-radius:18px;color:var(--ink);padding:8px 14px;font-size:16px;outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #ffffff2a;background:#ffffff0d;color:var(--ink);border-radius:14px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:linear-gradient(135deg,#f6d38b33,#f3b4c433);border-color:var(--gold);color:var(--gold)}
.legend{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);font-size:11px;color:var(--mute);background:#0b0a1fcc;border:1px solid #ffffff1a;border-radius:12px;padding:8px 10px;line-height:1.8;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.legend .x{cursor:pointer;float:right;margin-left:8px}

#sheet.open{transform:none;visibility:visible}
@media(min-width:760px){#sheet{left:auto;right:18px;bottom:18px;top:auto;width:400px;border-radius:18px;border:1px solid #f6d38b55;max-height:70%}}
#sheet .close{float:right;background:none;border:0;color:var(--mute);font-size:22px;cursor:pointer}
#sheet .who{font-size:12px;color:var(--gold)}
#sheet .txt{white-space:pre-wrap;line-height:1.7;font-size:15px;margin:10px 0 14px}
#sheet .faded{opacity:.65;font-style:italic}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:var(--mute)}
.grid>div{background:#ffffff0a;border-radius:10px;padding:8px}
.grid b{display:block;color:var(--ink);font-size:14px;font-weight:500;margin-top:2px}
.bar{height:5px;background:#ffffff1a;border-radius:2px;margin-top:5px;overflow:hidden}.bar span{display:block;height:100%;min-width:3px;border-radius:3px;background:linear-gradient(90deg,#b9a6ff,#f6d38b);box-shadow:0 0 8px #f6d38b99}
.links{margin-top:12px;font-size:12px;color:var(--mute)}.links .ln{display:block;width:100%;text-align:left;background:#ffffff0a;border:1px solid #ffffff14;border-radius:10px;color:var(--ink);padding:7px 9px;margin-top:6px;font-size:13px;cursor:pointer}.links .ln small{color:var(--gold);margin-right:6px}
.tags{margin-top:10px;font-size:12px;color:var(--rose)}
#gate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px}
#gate .card{background:#160f30ee;border:1px solid #f6d38b55;border-radius:18px;padding:22px;max-width:360px;width:100%}
#gate input{width:100%;margin:12px 0;background:#ffffff14;border:1px solid #ffffff30;border-radius:10px;color:var(--ink);padding:10px;font-size:16px}
#gate button,.btn{background:linear-gradient(135deg,#f6d38b,#f3b4c4);border:0;border-radius:12px;padding:10px 18px;color:#2a1838;font-weight:600;font-size:15px;cursor:pointer}
#msg{position:fixed;top:50%;left:0;right:0;text-align:center;color:var(--mute);font-size:14px}
a.back{color:var(--mute);font-size:12px;text-decoration:none;margin-left:auto}
</style></head><body>
