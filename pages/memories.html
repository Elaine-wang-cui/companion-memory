<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>我的记忆页</title>
<style>
:root{color-scheme:dark light;--bg:#0f1115;--card:#1a1d24;--ink:#f2efe8;--muted:#9a958c;--accent:#e8a87c;--line:#2a2e38;--ok:#7dcea0;--warn:#e6c07b}
@media (prefers-color-scheme:light){:root{--bg:#f6f1ea;--card:#fffdf9;--ink:#1c1916;--muted:#6d675e;--accent:#c45c26;--line:#e6ddd2;--ok:#2e7d4f;--warn:#9a6b00}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:16px 14px 60px}
main{max-width:860px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 4px;letter-spacing:.04em}
h2{font-size:1.05rem;margin:22px 0 8px;color:var(--accent)}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tabs button,.btn{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:.9rem}
.tabs button.on{background:var(--accent);color:#111;border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#111;border-color:var(--accent)}
.meta{color:var(--muted);font-size:.78rem;margin-bottom:4px}
.content{white-space:pre-wrap;line-height:1.6}
.pill{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-right:4px}
.open{color:var(--warn);border-color:var(--warn)} .done{color:var(--ok);border-color:var(--ok)}
textarea,input,select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit}
textarea{min-height:80px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.reply{border-left:3px solid var(--ok);padding-left:10px;margin-top:8px}
.quote{border-left:3px solid var(--line);padding-left:10px;color:var(--muted);margin:6px 0;white-space:pre-wrap}
#err{color:#e57373;min-height:1.2em}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>我的记忆页</h1>
<div class="sub">只读查看各位同伴的记忆。觉得哪条错了、变了，就给那位写张便条——由他自己决定改不改，并在这里回你。<a href="/memories?nav=shake" style="color:var(--accent)">花园摇一摇 →</a></div>
<div id="keybox" class="panel hide">
  <div class="meta">管理员密钥（只存在这台设备的浏览器里）</div>
  <div class="row"><input id="keyInput" type="password" autocomplete="off" placeholder="ADMIN_KEY" /><button class="btn primary" id="saveKey">保存</button></div>
</div>
<div id="err"></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
<div class="row" style="margin-top:28px"><button class="btn" id="changeKey">换密钥</button><button class="btn" id="reload">刷新</button></div>
</main>
<script>
(function(){
var KEY="companion_memories_key";
var state={data:null,tab:null};
var $=function(id){return document.getElementById(id)};
function getKey(){try{return localStorage.getItem(KEY)||""}catch(e){return ""}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function t(iso){if(!iso)return "";var d=new Date(new Date(iso).getTime()+8*3600000);return d.toISOString().slice(0,16).replace("T"," ")+" 本地时间"}
function showKey(f){if(f||!getKey())$("keybox").classList.remove("hide");else $("keybox").classList.add("hide")}
$("saveKey").onclick=function(){var v=$("keyInput").value.trim();if(!v)return;localStorage.setItem(KEY,v);$("keyInput").value="";showKey(false);load()};
$("changeKey").onclick=function(){showKey(true)};
$("reload").onclick=function(){load()};
function api(path,opts){opts=opts||{};opts.headers={"Authorization":"Bearer "+getKey(),"Content-Type":"application/json"};
  return fetch(path,opts).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.message||r.status);return j})})}
function load(){ $("err").textContent=""; if(!getKey()){showKey(true);return}
  api("/api/view/overview").then(function(d){state.data=d;if(!state.tab)state.tab=(d.personas[0]||{}).id||"family";render()}).catch(function(e){$("err").textContent=e.message;if(/密钥|管理员/.test(e.message))showKey(true)})}
function name(id){if(id==="family")return "全家";var p=(state.data.personas||[]).filter(function(x){return x.id===id})[0];return p?p.display_name:id}
function render(){var d=state.data;var tabs=$("tabs");tabs.innerHTML="";
  var ids=d.personas.map(function(p){return p.id}).concat(["family"]);
  ids.forEach(function(id){var b=document.createElement("button");var openN=d.notes.filter(function(n){return n.persona_id===id&&n.status==="replied"&&!seen(n)}).length;
    b.textContent=name(id)+(openN?" ·"+openN+"新回复":"");if(id===state.tab)b.className="on";b.onclick=function(){state.tab=id;render()};tabs.appendChild(b)});
  var id=state.tab,h=[];
  if(id!=="family"){
    var notes=d.notes.filter(function(n){return n.persona_id===id});
    h.push("<h2>便条（写给"+esc(name(id))+"）</h2>");
    h.push('<div class="panel"><div class="meta">写一张新便条（可不指定记忆）</div><textarea id="newNote" placeholder="比如：那天其实不是下雨，是下雪……"></textarea><div class="row"><button class="btn primary" data-note="">送出便条</button></div></div>');
    if(!notes.length)h.push('<div class="meta">还没有便条。</div>');
    notes.forEach(function(n){mark(n);h.push('<div class="panel"><div class="meta"><span class="pill '+(n.status==="open"?"open\">等他回":"done\">已回")+"</span>"+esc(t(n.created_at))+"</div>"+
      (n.memory_snapshot?'<div class="quote">'+esc(n.memory_snapshot)+"</div>":"")+'<div class="content">我：'+esc(n.content)+"</div>"+
      (n.status==="replied"?'<div class="reply"><div class="meta">'+esc(name(id))+" 回复 · "+esc(({fixed:"已改记忆",kept:"保留原样",forgot:"已删掉",other:"其他"})[n.reply_action]||n.reply_action||"")+" · "+esc(t(n.replied_at))+'</div><div class="content">'+esc(n.reply)+"</div></div>":"")+"</div>")});
    var hs=d.handoffs.filter(function(x){return x.persona_id===id}).slice(0,3);
    h.push("<h2>交接便签（最近）</h2>");
    if(!hs.length)h.push('<div class="meta">还没有。</div>');
    hs.forEach(function(x){h.push('<div class="panel"><div class="meta">'+esc(t(x.created_at))+(x.source_platform?" · "+esc(x.source_platform):"")+'</div><div class="content">'+esc(x.summary)+(x.mood?"\n心情："+esc(x.mood):"")+(x.next_time?"\n下次："+esc(x.next_time):"")+"</div></div>")});
    var us=d.unresolved.filter(function(x){return x.persona_id===id});
    h.push("<h2>未了的事</h2>");
    if(!us.length)h.push('<div class="meta">没有。</div>');
    us.forEach(function(x){h.push('<div class="panel"><div class="meta"><span class="pill '+(x.status==="open"?"open\">未了":"done\">已了")+"</span>重要"+x.importance+" · "+esc(t(x.created_at))+'</div><div class="content">'+esc(x.content)+(x.resolution?"\n了结："+esc(x.resolution):"")+"</div></div>")});
  }
  var ms=d.memories.filter(function(m){return m.owner_persona===id});
  h.push("<h2>"+esc(name(id))+"的记忆 · "+ms.length+" 条</h2>");
  if(id==="family")h.push('<div class="meta">全家共享的事实。便条要写给某一位同伴：在下面选。</div>');
  ms.forEach(function(m){var tags=[];try{tags=JSON.parse(m.tags||"[]")}catch(e){}
    h.push('<div class="panel"><div class="meta">'+esc(m.kind)+" · 重要"+m.importance+" · "+(m.visibility==="private"?"私有":"全家可见")+(m.event_date?" · "+esc(m.event_date):"")+(tags.length?" · "+esc(tags.join("、")):"")+" · "+esc(t(m.updated_at))+'</div><div class="content">'+esc(m.content)+'</div>'+
    '<div class="row"><button class="btn" data-toggle="'+esc(m.id)+'">这条不对 / 变了 → 写便条</button></div>'+
    '<div class="hide" id="f-'+esc(m.id)+'">'+(id==="family"?'<select id="to-'+esc(m.id)+'">'+d.personas.map(function(p){return '<option value="'+esc(p.id)+'">写给 '+esc(p.display_name)+"</option>"}).join("")+"</select>":"")+
    '<textarea id="t-'+esc(m.id)+'" placeholder="哪里不对、现在是什么样"></textarea><div class="row"><button class="btn primary" data-note="'+esc(m.id)+'">送出便条</button></div></div></div>')});
  $("view").innerHTML=h.join("");
}
var SEEN="companion_seen_replies";
function seenSet(){try{return JSON.parse(localStorage.getItem(SEEN)||"{}")}catch(e){return {}}}
function seen(n){return !!seenSet()[n.id+":"+n.replied_at]}
function mark(n){if(n.status!=="replied")return;var s=seenSet();s[n.id+":"+n.replied_at]=1;localStorage.setItem(SEEN,JSON.stringify(s))}
document.addEventListener("click",function(e){var el=e.target;
  if(el.dataset.toggle!=null){$("f-"+el.dataset.toggle).classList.toggle("hide");return}
  if(el.dataset.note!=null){var mid=el.dataset.note;var ta=mid?$("t-"+mid):$("newNote");var text=(ta.value||"").trim();if(!text){ta.focus();return}
    var to=state.tab;if(mid&&$("to-"+mid))to=$("to-"+mid).value;
    el.disabled=true;api("/api/view/notes",{method:"POST",body:JSON.stringify({persona_id:to,content:text,memory_id:mid||undefined})})
    .then(function(){state.tab=to;load()}).catch(function(err){$("err").textContent=err.message;el.disabled=false})}
});
load();
})();
</script>
</body>
</html>
